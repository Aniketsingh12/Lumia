# Render.com Blueprint — one-click deploy for the Lumio backend.
# Usage: push to GitHub → render.com → New → Blueprint → connect repo.
#
# The web service runs on the FREE tier. Note that free Render services sleep
# after ~15 minutes of inactivity and take ~30s to wake on the next request.
#
# The Celery worker is commented out by default: it needs Redis, and it is only
# required for asynchronous document ingestion.

services:
  - type: web
    name: lumio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Vectors live on this disk so the knowledge base survives redeploys.
    disk:
      name: lumio-chroma
      mountPath: /opt/render/project/src/backend/chroma_data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production

      # ── Auth ──
      # Generated by Render, never committed. Must NOT be the placeholder from
      # .env.example, or anyone could forge a login token.
      - key: JWT_SECRET
        generateValue: true

      # ── Database ──
      # false = use real Supabase (recommended for anything persistent).
      # true  = in-memory dev DB; data resets on every restart.
      - key: USE_DEV_DB
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── Vector store ──
      # Embedded ChromaDB persisted to the disk mounted above — no extra service.
      - key: CHROMA_MODE
        value: embedded
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/backend/chroma_data

      # ── LLM provider ──
      # "openai" + OPENAI_BASE_URL pointed at Groq gives free, fast inference on
      # open-source Llama models. Switch to "claude" and set CLAUDE_API_KEY for
      # higher answer quality.
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.1-8b-instant
      - key: OPENAI_API_KEY
        sync: false        # Groq key (gsk_...) or an OpenAI key
      - key: CLAUDE_API_KEY
        sync: false        # only needed when LLM_PROVIDER=claude

      # ── URLs ──
      - key: APP_URL
        sync: false        # your Vercel frontend URL — used for CORS + widget
      - key: API_URL
        sync: false        # this service's own URL; shown in channel webhooks

  # ── Optional background worker (needs Redis) ──
