# Railway configuration for the Lumio dashboard (frontend).
#
# Two dashboard settings are required for Railway to use this file at all:
#
#   1. Settings → Root Directory        = frontend
#   2. Settings → Config-as-code path   = /frontend/railway.toml
#
# That second path is ABSOLUTE FROM THE REPO ROOT, not relative to the root
# directory — setting it to just "railway.toml" fails the deploy with
# "service config at 'railway.toml' not found".
#
# Also required, as a service VARIABLE (not in this file):
#   VITE_API_URL = https://<the backend service domain>
# Vite inlines VITE_* vars at build time, so changing it needs a rebuild, not
# just a restart. See the ARG in Dockerfile.

[build]
# Use the repo's Dockerfile (Node build stage → Caddy serve stage) rather than
# letting Railpack guess. Caddy is what provides the SPA fallback that keeps
# client-side routes working on refresh; see Caddyfile.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand: the caddy base image's own entrypoint serves /etc/caddy/Caddyfile,
# which binds Railway's injected $PORT.
#
# No healthcheckPath either: the SPA fallback in Caddyfile returns index.html
# (HTTP 200) for every path, so a healthcheck would pass even if the app were
# broken — it would be a check that cannot fail, which is worse than none.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
